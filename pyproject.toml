[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "edu-shift-conformal"
version = "0.1.0"
dependencies = ["numpy<2", "pandas>=2.0,<3", "scikit-learn>=1.2", "pyyaml", "pyarrow", "catboost>=1.2"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
